name: Release Anti-Bar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies & build
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Run Rust unit tests
        working-directory: app/src-tauri
        run: cargo test --bin anti-bar

      - name: Build Windows NSIS installer & binary
        working-directory: app
        run: npx tauri build --bundles nsis

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item "app/src-tauri/target/release/anti-bar.exe" "dist-release/anti-bar.exe"
          if (Test-Path "app/src-tauri/target/release/WebView2Loader.dll") {
            Copy-Item "app/src-tauri/target/release/WebView2Loader.dll" "dist-release/WebView2Loader.dll"
          }
          Compress-Archive -Path "dist-release/*" -DestinationPath "Anti-Bar-portable-win64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Anti-Bar-portable-win64.zip
            app/src-tauri/target/release/anti-bar.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
